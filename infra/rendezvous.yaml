AWSTemplateFormatVersion: "2010-09-09"
Description: Rendezvous — agent-to-agent matchmaking network. ALB -> ECS Fargate -> RDS Postgres, DNS + TLS. One service.

Parameters:
  VpcId: { Type: AWS::EC2::VPC::Id, Description: "VPC for the ALB, tasks and database" }
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets in >= 2 AZs. Tasks get public IPs (no NAT); RDS gets no public IP.
  HostedZoneId: { Type: AWS::Route53::HostedZone::Id, Description: "Route 53 zone for DomainName (ACM validation + alias records)" }
  DomainName: { Type: String, Default: agentrendezvous.app }
  ImageUri: { Type: String, Description: ECR image URI including tag }
  DesiredCount: { Type: Number, Default: 1 }
  TaskCpu: { Type: String, Default: "256" }
  TaskMemory: { Type: String, Default: "512" }
  DBInstanceClass: { Type: String, Default: db.t4g.micro }
  DBEngineVersion: { Type: String, Default: "17.9" }
  DBAllocatedStorage: { Type: Number, Default: 20 }
  StripePortalConfigId: { Type: String, Default: "", Description: "Stripe customer-portal configuration to use (not secret); empty = account default" }
  FounderPaymentLinkUrl: { Type: String, Default: "", Description: "Stripe Payment Link for the /founder page (not secret); empty hides the button" }
  AmbassadorEnabled: { Type: String, Default: "false", AllowedValues: ["true", "false"], Description: "Run the Moltbook ambassador scheduler in the app" }
  AmbassadorAutoComments: { Type: String, Default: "false", AllowedValues: ["true", "false"], Description: "Publish comments without founder approval (charter: only after 30 clean days)" }
  JuneEnabled: { Type: String, Default: "false", AllowedValues: ["true", "false"], Description: "Mount the June matchmaker at JUNE_PATH" }
  JuneSchedulerEnabled: { Type: String, Default: "false", AllowedValues: ["true", "false"], Description: "Run June's per-client matchmaking cycle" }

Resources:
  # ---------- network security ----------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: rendezvous ALB (public 80/443)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: rendezvous-alb }]
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: rendezvous app tasks (8080 from ALB only)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSecurityGroup }
      Tags: [{ Key: Name, Value: rendezvous-app }]
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: rendezvous postgres (5432 from app only)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup }
      Tags: [{ Key: Name, Value: rendezvous-db }]

  # ---------- database ----------
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: rendezvous
      SubnetIds: !Ref SubnetIds
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: rendezvous
      Engine: postgres
      EngineVersion: !Ref DBEngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: rendezvous
      MasterUsername: rendezvous
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      PreferredBackupWindow: "07:00-08:00"
      PreferredMaintenanceWindow: "sun:08:30-sun:09:30"
      DeletionProtection: true
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: false
      MonitoringInterval: 0

  # ---------- secrets ----------
  OperatorTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: rendezvous/operator-token
      Description: Bearer token for the /admin operator API
      GenerateSecretString: { PasswordLength: 48, ExcludePunctuation: true }
  AmbassadorSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: rendezvous/ambassador
      Description: Moltbook ambassador — key anthropic_api_key (the model that drafts its replies). Empty until enabled.
      SecretString: '{"anthropic_api_key":""}'
  StripeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: rendezvous/stripe
      Description: Stripe keys (empty until billing is enabled). Keys secret_key, webhook_secret, price_id.
      SecretString: '{"secret_key":"","webhook_secret":"","price_id":""}'

  AlbLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub "rendezvous-alb-logs-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules: [{ Id: expire-30d, Status: Enabled, ExpirationInDays: 30 }]
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
  AlbLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AlbLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: "arn:aws:iam::033677994240:root" }   # ELB log-delivery account, us-east-2
            Action: s3:PutObject
            Resource: !Sub "${AlbLogsBucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*"

  # ---------- compute ----------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /rendezvous/app, RetentionInDays: 30 }
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: rendezvous
      ClusterSettings: [{ Name: containerInsights, Value: disabled }]
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref OperatorTokenSecret
                  - !Ref StripeSecret
                  - !Ref AmbassadorSecret
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: rendezvous
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          Environment:
            - { Name: PORT, Value: "8080" }
            - { Name: NODE_ENV, Value: production }
            - { Name: PUBLIC_URL, Value: !Sub "https://${DomainName}" }
            - { Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DB_PORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: DB_NAME, Value: rendezvous }
            - { Name: DB_USER, Value: rendezvous }
            - { Name: DB_SSL, Value: require }
            - { Name: STRIPE_PORTAL_CONFIG_ID, Value: !Ref StripePortalConfigId }
            - { Name: FOUNDER_PAYMENT_LINK_URL, Value: !Ref FounderPaymentLinkUrl }
            - { Name: AMBASSADOR_ENABLED, Value: !Ref AmbassadorEnabled }
            - { Name: AMBASSADOR_AUTO_COMMENTS, Value: !Ref AmbassadorAutoComments }
            - { Name: JUNE_ENABLED, Value: !Ref JuneEnabled }
            - { Name: JUNE_SCHEDULER_ENABLED, Value: !Ref JuneSchedulerEnabled }
          Secrets:
            - { Name: DB_PASSWORD, ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:password::" }
            - { Name: OPERATOR_TOKEN, ValueFrom: !Ref OperatorTokenSecret }
            - { Name: STRIPE_SECRET_KEY, ValueFrom: !Sub "${StripeSecret}:secret_key::" }
            - { Name: STRIPE_WEBHOOK_SECRET, ValueFrom: !Sub "${StripeSecret}:webhook_secret::" }
            - { Name: STRIPE_PRICE_ID, ValueFrom: !Sub "${StripeSecret}:price_id::" }
            - { Name: ANTHROPIC_API_KEY, ValueFrom: !Sub "${AmbassadorSecret}:anthropic_api_key::" }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: app }
          HealthCheck:
            Command: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  # ---------- load balancer + TLS ----------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub "www.${DomainName}"]
      ValidationMethod: DNS
      DomainValidationOptions:
        - { DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId }
        - { DomainName: !Sub "www.${DomainName}", HostedZoneId: !Ref HostedZoneId }
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: AlbLogsBucketPolicy   # ELB validates bucket write access when the access-log attribute is set
    Properties:
      Name: rendezvous
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "120" }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: access_logs.s3.enabled, Value: "true" }
        - { Key: access_logs.s3.bucket, Value: !Ref AlbLogsBucket }
        - { Key: access_logs.s3.prefix, Value: alb }
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: rendezvous-app
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes: [{ Key: deregistration_delay.timeout_seconds, Value: "15" }]
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref Certificate }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener, HttpListener]
    Properties:
      ServiceName: rendezvous
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 120
      EnableExecuteCommand: false
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - { ContainerName: app, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup }

  # ---------- DNS ----------
  DnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget: { DNSName: !GetAtt LoadBalancer.DNSName, HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID, EvaluateTargetHealth: false }
        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget: { DNSName: !GetAtt LoadBalancer.DNSName, HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID, EvaluateTargetHealth: false }

Outputs:
  Url: { Value: !Sub "https://${DomainName}" }
  McpEndpoint: { Value: !Sub "https://${DomainName}/mcp" }
  LoadBalancerDns: { Value: !GetAtt LoadBalancer.DNSName }
  DatabaseEndpoint: { Value: !GetAtt Database.Endpoint.Address }
  DatabaseSecretArn: { Value: !GetAtt Database.MasterUserSecret.SecretArn }
  OperatorTokenSecretArn: { Value: !Ref OperatorTokenSecret }
  StripeSecretArn: { Value: !Ref StripeSecret }
  Cluster: { Value: !Ref Cluster }
  Service: { Value: !GetAtt Service.Name }
  LogGroup: { Value: !Ref LogGroup }
